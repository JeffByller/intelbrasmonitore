services:
  db:
    image: postgres:15-alpine
    container_name: intelbras_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-monitor_db}
      TZ: ${TZ:-America/Recife}
      PGTZ: ${TZ:-America/Recife}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor_user} -d ${POSTGRES_DB:-monitor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    networks:
      - monitor_net

  app:
    build: .
    container_name: intelbras_monitor_app
    restart: always
    ports:
      - "${PORT:-8085}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - TZ=${TZ:-America/Recife}
    volumes:
      - ./app:/app/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 192M
    networks:
      - monitor_net

volumes:
  postgres_data:

networks:
  monitor_net:
    driver: bridge
